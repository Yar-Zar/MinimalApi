name: CI to GHCR & GitOps Update

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}  # GHCR အတွက် ဖွဲ့စည်းထားသော Secret (သို့မဟုတ် GITHUB_TOKEN)

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./TestMinimalApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Kubernetes Manifest in GitOps Repo
        uses: fjogeleit/yaml-update-action@main
        with:
          repository: Yar-Zar/K8s-Manifests-Repository
          branch: main
          token: ${{ secrets.GITOPS_ACCESS_TOKEN }}
          valueFile: 'deployment.yaml'                  # targetFile အစား valueFile ကို သုံးပါ
          propertyPath: 'spec.template.spec.containers[0].image'
          value: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          message: 'CI: Update image tag to ${{ steps.meta.outputs.version }}' # commitMessage အစား message ကို သုံးပါ