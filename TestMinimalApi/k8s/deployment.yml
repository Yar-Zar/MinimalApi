apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-minimal-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-minimal-api
  template:
    metadata:
      labels:
        app: test-minimal-api
    spec:
      containers:
      - name: api
        image: YOUR_DOCKERHUB_USERNAME/test-minimal-api:latest
        ports:
        - containerPort: 8080   # Minimal API သို့မဟုတ် .NET 8 default port နဲ့ ကိုက်ညီစေရန်
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"