name: CI to GHCR & GitOps Update

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # GitHub repository නာမည်ကို အစဥ်အမြဲ စာလုံးသေး (Lowercase) ဖြစ်စေရန် ချက်ချင်းပြောင်းပေးခြင်း
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # toLower သုံး၍ GHCR လိုအပ်ချက်အရ စာလုံးသေးဖြင့် သတ်မှတ်ခြင်း
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,format=short
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./TestMinimalApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

     # 1. K8s Manifest Repo ကို သီးသန့် Folder တစ်ခုအနေဖြင့် ထပ်မံ Checkout လုပ်ခြင်း
      - name: Checkout K8s Manifests Repo
        uses: actions/checkout@v4
        with:
          repository: Yar-Zar/K8s-Manifests-Repository
          token: ${{ secrets.GITOPS_ACCESS_TOKEN }}
          path: k8s-manifests
          persist-credentials: true

      # 2. Manifest ဖိုင်ထဲက Image Tag ကို တိကျစွာ အသစ်လဲလှယ်ခြင်း
      - name: Update Kubernetes Image Tag
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          LOWER_IMAGE=$(echo "${{ env.FULL_IMAGE }}" | tr '[:upper:]' '[:lower:]')
          
          # deployment.yaml ထဲရှိ image line ကို ရှာပြီး အသစ်ဖြင့် အစားထိုးခြင်း
          sed -i "s|image:.*|image: ${LOWER_IMAGE}:${IMAGE_VERSION}|g" k8s-manifests/deployment.yaml

      # 3. K8s Manifest Repo ထဲသို့ Git Commit & Push ပြန်လုပ်ခြင်း (Token ဖြင့် Authenticate လုပ်ရန်)
      - name: Commit and Push to Manifest Repo
        run: |
          cd k8s-manifests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add deployment.yaml
          
          if ! git diff --cached --quiet; then
            git commit -m "CI: Update image tag to ${{ steps.meta.outputs.version }}"
            git push https://x-access-token:${{ secrets.GITOPS_ACCESS_TOKEN }}@github.com/Yar-Zar/K8s-Manifests-Repository.git main
          fi