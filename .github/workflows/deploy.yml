name: CI to GHCR & GitOps Update

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # GitHub repository නာမည်ကို အစဥ်အမြဲ စာလုံးသေး (Lowercase) ဖြစ်စေရန် ချက်ချင်းပြောင်းပေးခြင်း
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./TestMinimalApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

     # 1. K8s Manifest Repo ကို ရှင်းလင်းစွာ Checkout လုပ်ခြင်း
      - name: Checkout K8s Manifests Repo
        uses: actions/checkout@v4
        with:
          repository: Yar-Zar/K8s-Manifests-Repository
          token: ${{ secrets.GITOPS_ACCESS_TOKEN }}
          path: k8s-manifests
          persist-credentials: true

      # 2. 'latest' အစား တိကျသော Commit SHA (sha-xxxx) ကို သီးသန့်ထုတ်၍ အစားထိုးခြင်း
      - name: Update Kubernetes Image Tag
        env:
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          LOWER_IMAGE=$(echo "${{ env.FULL_IMAGE }}" | tr '[:upper:]' '[:lower:]')
          
          # github.sha ရဲ့ ရှေ့စာလုံး ၇ လုံးကို ယူ၍ sha-xxxx ပုံစံဖန်တီးခြင်း
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}"
          
          echo "Updating deployment.yaml with image: ${LOWER_IMAGE}:${IMAGE_TAG}"
          
          # Exact match ဖြင့် deployment.yaml ထဲရှိ image tag ကို တိကျစွာပြောင်းမည်
          sed -i "s|image: ${LOWER_IMAGE}:.*|image: ${LOWER_IMAGE}:${IMAGE_TAG}|g" k8s-manifests/deployment.yaml

      # 3. Git Commit & Push ကို အလိုအလျောက် လုပ်ဆောင်ခြင်း
      - name: Commit and Push to Manifest Repo
        run: |
          cd k8s-manifests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add deployment.yaml
          
          if ! git diff --cached --quiet; then
            git commit -m "CI: Auto-update image tag to sha-$(echo ${{ github.sha }} | cut -c1-7)"
            git push https://x-access-token:${{ secrets.GITOPS_ACCESS_TOKEN }}@github.com/Yar-Zar/K8s-Manifests-Repository.git main
          fi