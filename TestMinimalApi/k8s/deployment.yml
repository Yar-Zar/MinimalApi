apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-minimal-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-minimal-api
  template:
    metadata:
      labels:
        app: test-minimal-api
    spec:
      containers:
      - name: test-minimal-api
        image: ghcr.io/YOUR_GITHUB_USERNAME/test-minimal-api:latest
        ports:
        - containerPort: 8080  
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"