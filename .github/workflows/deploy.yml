name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.CR_PAT }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./TestMinimalApi/Dockerfile
        push: true
        tags: |
          ghcr.io/yar-zar/minimalapi:${{ github.sha }}
          ghcr.io/yar-zar/minimalapi:latest

    - name: Update Kubernetes image tag
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        sed -i \
          "s|image: ghcr.io/yar-zar/minimalapi:.*|image: ghcr.io/yar-zar/minimalapi:${IMAGE_TAG}|" \
          TestMinimalApi/k8s/deployment.yml

    - name: Commit and push GitOps change
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add TestMinimalApi/k8s/deployment.yml

        if ! git diff --cached --quiet; then
          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push origin HEAD:main
        fi
