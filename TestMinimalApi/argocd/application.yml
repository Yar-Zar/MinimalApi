apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minimalapi-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Yar-Zar/K8s-Manifests-Repository'
    targetRevision: main
    path: '.'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true